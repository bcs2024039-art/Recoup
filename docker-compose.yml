services:
  # -- Python batch engine (FastAPI) --------------------------------------
  api:
    build:
      context: ./backend
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    # Not exposed externally — only reachable by the web service
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -- Node.js frontend + Express proxy -----------------------------------
  web:
    build:
      context: ./frontend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Points to the internal Docker network name of the api service
      - PYTHON_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
